<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>財表ドリル</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>財表ドリル</h1>
  <div id="onboarding-info">
    <p class="disclaimer">
      財務諸表論ポイントチェックの問題を解いて学習履歴を記録します。学習履歴はこの端末のブラウザ内にのみ保存されます。
      問題データも初回読み込み後はこの端末に保存されるため、次回からは自動的に学習を始められます。
    </p>
    <p id="data-source-status" class="data-source-status"></p>
  </div>
</header>

<section id="initial-setup" class="initial-setup">
  <p class="initial-setup-desc">
    以下からExercise View JSON（問題データ）ファイルを選択すると、学習を開始できます。
  </p>
  <div class="control-row">
    <label for="initial-file-input">Exercise View JSONファイルを選択:</label>
  </div>
  <div class="control-row">
    <input type="file" id="initial-file-input" accept="application/json,.json">
  </div>
  <p id="initial-setup-loading" class="initial-setup-loading" hidden>データを読み込んでいます…</p>
  <div id="initial-setup-error" class="error-panel" hidden></div>
</section>

<div id="main-app" hidden>

<section id="study-setup">
  <h2>学習設定</h2>
  <div class="control-row">
    <label for="study-setup-theme-filter">テーマ:</label>
    <select id="study-setup-theme-filter"></select>
  </div>
  <div class="control-row">
    <label for="study-setup-section-filter">節:</label>
    <select id="study-setup-section-filter"></select>
  </div>
  <div class="control-row">
    <label for="study-setup-topic-filter">論点:</label>
    <select id="study-setup-topic-filter"></select>
  </div>
  <div class="control-row">
    <label for="study-setup-type-filter">問題形式:</label>
    <select id="study-setup-type-filter">
      <option value="all">全て</option>
      <option value="true_false">true_false</option>
      <option value="single_blank">single_blank</option>
      <option value="multi_blank">multi_blank</option>
      <option value="ordering">ordering（item-1090限定）</option>
      <option value="unsupported">未対応形式</option>
    </select>
  </div>
  <div class="control-row">
    <label for="study-setup-mode-filter">出題モード:</label>
    <select id="study-setup-mode-filter">
      <option value="all">すべての問題</option>
      <option value="unmastered">未修得の問題</option>
      <option value="checked">チェック問題</option>
    </select>
  </div>
  <p id="study-setup-count" class="study-setup-count"></p>
  <div id="study-setup-empty" class="empty-state" hidden></div>
  <div class="control-row">
    <button type="button" id="start-study-btn" class="next-btn">学習を始める</button>
  </div>
  <div class="control-row">
    <button type="button" id="open-browse-view-btn">問題一覧を見る（検索・デバッグ用）</button>
  </div>
</section>

<section id="study-session" hidden>
  <div class="study-session-header">
    <div id="study-session-progress" class="study-session-progress"></div>
    <button type="button" id="end-study-btn" class="end-study-btn" aria-label="学習を終了する">&times;</button>
  </div>
  <div id="study-session-card-container"></div>
</section>

<section id="study-review" hidden>
  <div id="study-review-list-view">
    <h2>今回の学習結果</h2>
    <div id="study-review-stats" class="study-review-stats"></div>
    <div class="control-row study-review-filter-row">
      <button type="button" id="study-review-filter-all" class="filter-chip filter-chip-active">すべて</button>
      <button type="button" id="study-review-filter-wrong" class="filter-chip">誤答・要復習のみ</button>
    </div>
    <div id="study-review-list" class="study-review-list"></div>
    <div class="control-row">
      <button type="button" id="study-review-back-btn" class="next-btn">学習設定に戻る</button>
    </div>
  </div>
  <div id="study-review-detail-view" hidden>
    <button type="button" id="study-review-detail-back-btn" class="back-btn">← 一覧に戻る</button>
    <div id="study-review-detail-body"></div>
  </div>
</section>

<div id="browse-view" hidden>

<div class="control-row">
  <button type="button" id="back-to-setup-btn">← 学習設定に戻る</button>
</div>

<section class="controls">
  <details class="control-row data-source-details" id="data-source-details">
    <summary>データソースを変更する（通常は操作不要）</summary>
    <p class="data-source-help">
      問題データを更新したい場合はここから読み込んでください。
    </p>
    <div class="control-row">
      <label for="ev-file-input">Exercise View JSON（例: output/exercise_view_full.json）を選択:</label>
    </div>
    <div class="control-row">
      <input type="file" id="ev-file-input" accept="application/json,.json">
    </div>
    <div class="control-row">
      <button type="button" id="fetch-sample-btn">./data/exercise_view_full.json を再読み込み（HTTPサーバー経由時のみ動作）</button>
    </div>
  </details>
  <div class="control-row">
    <label for="type-filter">表示形式フィルタ:</label>
    <select id="type-filter">
      <option value="all">全て</option>
      <option value="true_false">true_false</option>
      <option value="single_blank">single_blank</option>
      <option value="multi_blank">multi_blank</option>
      <option value="ordering">ordering（item-1090限定）</option>
      <option value="unsupported">未対応形式のみ</option>
    </select>
  </div>
  <div class="control-row">
    <label for="study-mode-filter">出題モード:</label>
    <select id="study-mode-filter">
      <option value="all">全ての問題</option>
      <option value="unmastered">未修得の問題</option>
      <option value="checked">チェック問題</option>
    </select>
  </div>
</section>

<div id="error-panel" class="error-panel" hidden></div>

<!-- v2-5: 診断パネル一式。通常利用時は非表示（?debug=1のときのみ表示、app.js側で制御）。 -->
<div id="debug-panels">
  <div id="meta-panel" class="meta-panel"></div>
  <div id="timing-panel" class="timing-panel"></div>
  <div id="answer-form-panel" class="diagnostic-panel"></div>
  <div id="progress-key-panel" class="diagnostic-panel"></div>
  <div id="multi-blank-panel" class="diagnostic-panel"></div>
  <div id="progress-storage-panel" class="diagnostic-panel"></div>
</div>

<div class="control-row settings-row">
  <button type="button" id="reset-progress-btn" class="danger-btn">学習履歴をリセット</button>
</div>

<div id="empty-state" class="empty-state" hidden></div>
<main id="exercise-list" class="exercise-list"></main>

<button type="button" id="load-more-btn" class="load-more-btn" hidden>さらに読み込む</button>

</div>
<!-- /#browse-view -->

</div>
<!-- /#main-app -->

<!-- v2-9: 学習終了の確認ダイアログ（ブラウザ標準confirm()は使わず、既存UIに馴染む見た目にする）。 -->
<div id="end-study-confirm" class="modal-backdrop" hidden>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="end-study-confirm-title">
    <p id="end-study-confirm-title" class="modal-title">学習を終了しますか？</p>
    <div class="modal-actions">
      <button type="button" id="end-study-confirm-no" class="modal-btn">いいえ</button>
      <button type="button" id="end-study-confirm-yes" class="modal-btn modal-btn-primary">はい</button>
    </div>
  </div>
</div>

<script src="js/debugMode.js"></script>
<script src="js/evLoader.js"></script>
<script src="js/dataCache.js"></script>
<script src="js/progressKey.js"></script>
<script src="js/progressStore.js"></script>
<script src="js/orderingAdapter.js"></script>
<script src="js/blankMarkerIndex.js"></script>
<script src="js/registry.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
