<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>boki-app 開発用確認UI(閲覧のみ)</title>
<style>
  /* 開発用。デザインの作り込みはしない(vertical_slice_mvp_roadmap.md 5-1節)。 */
  body {
    font-family: -apple-system, "Yu Gothic", "Meiryo", sans-serif;
    background: #f5f5f5;
    color: #111;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 24px; }
  section {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 16px;
  }
  section h2 {
    font-size: 14px;
    margin: 0 0 10px;
    color: #333;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section h2 .step {
    display: inline-block;
    background: #333;
    color: #fff;
    border-radius: 3px;
    padding: 1px 7px;
    font-size: 12px;
  }
  .field { margin: 6px 0; }
  .field .label { color: #888; font-size: 12px; }
  pre {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    margin: 4px 0;
  }
  .formula {
    font-size: 16px;
    padding: 10px;
    background: #eef7ee;
    border: 1px solid #bcdcbc;
    border-radius: 3px;
  }
  .arrow { text-align: center; color: #999; margin: -8px 0 8px; }
  .badge {
    display: inline-block;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 12px;
    font-weight: bold;
  }
  .badge.ok { background: #d9f2d9; color: #256029; }
  .badge.warn { background: #f9e9c0; color: #7a5b00; }
  .scope-out { color: #888; font-size: 13px; }
  #error { color: #b00020; white-space: pre-wrap; }
  table { border-collapse: collapse; font-size: 13px; }
  td, th { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  .review-panel { border-top: 1px dashed #ccc; margin-top: 12px; padding-top: 12px; }
  .action-panel {
    border: 1px solid #ddd;
    background: #fafafa;
    border-radius: 3px;
    padding: 10px;
    margin: 8px 0;
  }
  .action-panel .field { display: flex; flex-direction: column; gap: 2px; }
  .action-panel input[type="text"], .action-panel textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 4px;
    width: 100%;
    max-width: 480px;
    box-sizing: border-box;
  }
  .action-panel textarea { min-height: 3em; }
  button { cursor: pointer; }
  .action-error { color: #b00020; font-size: 13px; margin-top: 4px; }
  .m5-ready {
    font-size: 13px;
    padding: 8px 10px;
    background: #eef7ee;
    border: 1px solid #bcdcbc;
    border-radius: 3px;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>boki-app 開発用確認UI(閲覧のみ)</h1>
  <div class="meta">
    このUIは開発用の確認画面です。1〜6の各段階は表示専用ですが、
    「7. Derived Knowledge候補」のみ、承認・修正・除外の操作ができます
    (<code>m4_review_workflow_design.md</code>)。
  </div>

  <div id="error"></div>
  <div id="app"></div>

  <script type="module">
    // 往復整合性の検証には、生成処理(src/knowledge/deriveKnowledgeCandidate.mjs)
    // と全く同じrenderTokensをサーバ経由でそのままimportする(重複実装による
    // 意図しないロジックの食い違いを避けるため。/lib/配下は許可リスト制、
    // src/devViewer/server.mjs参照)。
    import { renderTokens } from "/lib/formulaTokenizer.mjs";

    const CASE_NAME = "teigakuho-definition";

    // M5: /api/exercisesの取得結果をキャッシュしておく。M4の承認/修正/除外は
    // ケースデータだけを再取得してrender()を呼び直すため(既存の実装)、
    // Exercise一覧はページ読み込み時に一度だけ取得し、再描画のたびに
    // 使い回す(Exercise生成はM4の操作とは独立したCLIステップのため、
    // 毎回再取得する必要が無い)。
    let latestExercisesData = null;

    // M4: 承認/修正/除外のPOSTを呼ぶ共通関数。
    async function postReview(action, body) {
      const res = await fetch(`/api/case/${CASE_NAME}/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body ?? {}),
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || `HTTPエラー: ${res.status}`);
      }
      return data;
    }

    function textareaEl(initialValue) {
      const t = document.createElement("textarea");
      t.value = initialValue ?? "";
      return t;
    }

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k === "html") node.innerHTML = v;
        else node.setAttribute(k, v);
      }
      for (const child of [].concat(children)) {
        if (child == null) continue;
        node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    function field(label, value) {
      return el("div", { class: "field" }, [
        el("div", { class: "label" }, label),
        el("div", {}, value),
      ]);
    }

    function pre(text) {
      return el("pre", {}, text ?? "(なし)");
    }

    function badge(text, kind) {
      return el("span", { class: `badge ${kind}` }, text);
    }

    // structure.tokensを人間が読める入れ子リストとして表示する(折りたたみの
    // 生JSONとは別に、パッと見て分解結果が分かるようにするための補助表示)。
    function renderStructureTree(node) {
      if (node.kind === "sequence" || node.kind === "group") {
        return el("ul", {}, [
          el("li", {}, `${node.kind}`),
          el(
            "ul",
            {},
            node.tokens.map((child) => el("li", {}, renderStructureTree(child))),
          ),
        ]);
      }
      if (node.kind === "fraction") {
        return el("ul", {}, [
          el("li", {}, "fraction"),
          el("li", {}, ["分子: ", ...node.numerator.map((t) => el("span", {}, `${t.value} `))]),
          el("li", {}, ["分母: ", ...node.denominator.map((t) => el("span", {}, `${t.value} `))]),
        ]);
      }
      return `${node.kind}: "${node.value}"`;
    }

    const STATUS_LABEL = { candidate: "候補(未レビュー)", approved: "承認済み", rejected: "除外済み" };
    const STATUS_KIND = { candidate: "warn", approved: "ok", rejected: "warn" };

    // M4: 承認/修正/除外の操作パネル。candidateのときのみ操作でき、
    // approved/rejectedになった後は結果を表示するだけの読み取り専用になる
    // (`m4_review_workflow_design.md`1-1節、一方向の状態遷移)。
    function renderReviewPanel(dkc) {
      const container = el("div", { class: "review-panel" });
      container.append(
        el("div", { class: "field" }, [
          el("span", { class: "label" }, "現在の状態: "),
          badge(STATUS_LABEL[dkc.reviewStatus], STATUS_KIND[dkc.reviewStatus]),
        ]),
      );

      if (dkc.reviewStatus === "approved") {
        container.append(field("承認日時", dkc.reviewedAt));
        if (dkc.reviewNote) container.append(field("メモ", dkc.reviewNote));
        container.append(
          el(
            "div",
            { class: "m5-ready" },
            "✓ 公式Knowledgeとして output/knowledge/approved-knowledge.json に反映されました。M5(Exercise生成)から利用可能です。",
          ),
        );
        return container;
      }

      if (dkc.reviewStatus === "rejected") {
        container.append(field("除外日時", dkc.reviewedAt));
        container.append(field("除外理由", dkc.reviewNote || "(未記入)"));
        container.append(
          el(
            "div",
            { class: "scope-out" },
            "候補として検出されましたが、人間の判断で不採用となりました。この記録は監査証跡として残り、approved-knowledge.jsonには含まれません。",
          ),
        );
        return container;
      }

      // --- candidate: 操作可能 ---
      const errorBox = el("div", { class: "action-error" });

      const approvePanel = el("div", { class: "action-panel" });
      approvePanel.style.display = "none";
      approvePanel.append(
        el(
          "div",
          {},
          "承認すると公式Knowledgeとして確定し、M5(Exercise生成)から利用可能になります。取り消しはできません。よろしいですか?",
        ),
      );
      const approveConfirmBtn = el("button", {}, "はい、承認する");
      const approveCancelBtn = el("button", {}, "キャンセル");
      approvePanel.append(el("div", {}, [approveConfirmBtn, " ", approveCancelBtn]));

      const levelInput = el("input", { type: "text", value: dkc.knowledge.contentConfidence.level });
      const confNoteInput = textareaEl(dkc.knowledge.contentConfidence.note ?? "");
      const scopeNoteInput = textareaEl(dkc.knowledge.scopeNote ?? "");
      const editNoteInput = textareaEl("");
      const editPanel = el("div", { class: "action-panel" });
      editPanel.style.display = "none";
      editPanel.append(
        el("div", { class: "field" }, [el("span", { class: "label" }, "contentConfidence.level"), levelInput]),
        el("div", { class: "field" }, [el("span", { class: "label" }, "contentConfidence.note"), confNoteInput]),
        el("div", { class: "field" }, [el("span", { class: "label" }, "scopeNote"), scopeNoteInput]),
        el("div", { class: "field" }, [el("span", { class: "label" }, "修正メモ(任意、reviewNoteに記録)"), editNoteInput]),
      );
      const editSaveBtn = el("button", {}, "保存");
      const editCancelBtn = el("button", {}, "キャンセル");
      editPanel.append(el("div", {}, [editSaveBtn, " ", editCancelBtn]));

      const rejectNoteInput = textareaEl("");
      const rejectPanel = el("div", { class: "action-panel" });
      rejectPanel.style.display = "none";
      rejectPanel.append(
        el("div", { class: "field" }, [el("span", { class: "label" }, "除外理由(任意)"), rejectNoteInput]),
      );
      const rejectConfirmBtn = el("button", {}, "除外を確定する");
      const rejectCancelBtn = el("button", {}, "キャンセル");
      rejectPanel.append(el("div", {}, [rejectConfirmBtn, " ", rejectCancelBtn]));

      function hideAllPanels() {
        approvePanel.style.display = "none";
        editPanel.style.display = "none";
        rejectPanel.style.display = "none";
        errorBox.textContent = "";
      }

      const approveBtn = el("button", {}, "承認");
      const editBtn = el("button", {}, "修正");
      const rejectBtn = el("button", {}, "除外");
      approveBtn.addEventListener("click", () => { hideAllPanels(); approvePanel.style.display = "block"; });
      editBtn.addEventListener("click", () => { hideAllPanels(); editPanel.style.display = "block"; });
      rejectBtn.addEventListener("click", () => { hideAllPanels(); rejectPanel.style.display = "block"; });
      approveCancelBtn.addEventListener("click", hideAllPanels);
      editCancelBtn.addEventListener("click", hideAllPanels);
      rejectCancelBtn.addEventListener("click", hideAllPanels);

      approveConfirmBtn.addEventListener("click", async () => {
        try {
          const data = await postReview("approve", {});
          render(data);
        } catch (err) {
          errorBox.textContent = `エラー: ${err.message}`;
        }
      });

      editSaveBtn.addEventListener("click", async () => {
        try {
          const data = await postReview("edit", {
            contentConfidence: { level: levelInput.value, note: confNoteInput.value },
            scopeNote: scopeNoteInput.value,
            note: editNoteInput.value || undefined,
          });
          render(data);
        } catch (err) {
          errorBox.textContent = `エラー: ${err.message}`;
        }
      });

      rejectConfirmBtn.addEventListener("click", async () => {
        try {
          const data = await postReview("reject", { note: rejectNoteInput.value || undefined });
          render(data);
        } catch (err) {
          errorBox.textContent = `エラー: ${err.message}`;
        }
      });

      container.append(
        el("div", { class: "field" }, [approveBtn, " ", editBtn, " ", rejectBtn]),
        approvePanel,
        editPanel,
        rejectPanel,
        errorBox,
      );
      return container;
    }

    function render(data) {
      const app = document.getElementById("app");
      app.innerHTML = "";

      const { structureContext, block, candidateReport, outOfScopeDetections } = data;

      // 0. ケース概要
      app.append(
        el("section", {}, [
          el("h2", {}, `ケース: ${data.case}`),
          field("生成日時", data.generatedAt),
        ]),
      );

      // 1. 教材上の位置情報
      app.append(
        el("section", {}, [
          el("h2", {}, [el("span", { class: "step" }, "1"), "教材上の位置情報"]),
          field(
            "テーマ",
            `${structureContext.theme.label.number}　${structureContext.theme.label.titleRaw}`,
          ),
          field(
            "論点",
            `${structureContext.topic.label.number}　${structureContext.topic.label.titleRaw}`,
          ),
          field(
            "ページ(PDF内通し番号 / 教材印字ページ番号)",
            `${block.location.page}ページ目 / 印字ページ "${block.location.printedPageLabel}"`,
          ),
          field("ブロック種別(blockKind)", block.blockKind),
          field("検出根拠", `${block.detection.detectorId}(直前見出し: ${block.detection.precedingHeading ?? "(検出できず)"})`),
        ]),
      );
      app.append(el("div", { class: "arrow" }, "↓ [1] Extraction"));

      // 2. extractionRaw
      app.append(
        el("section", {}, [
          el("h2", {}, [el("span", { class: "step" }, "2"), "抽出結果(extractionRaw) — PDFから何が抽出されたか"]),
          field(
            "抽出ツール",
            `${block.extractionRaw.tool} ${block.extractionRaw.toolVersion}(${block.extractionRaw.invocation})`,
          ),
          field("生テキスト", pre(block.extractionRaw.text)),
        ]),
      );
      app.append(el("div", { class: "arrow" }, "↓ [5] Faithful Restoration"));

      // 3. Faithful Restoration
      const fr = block.diag.faithfulReconstruction;
      const artifacts = block.diag.extraction.artifacts ?? [];
      app.append(
        el("section", {}, [
          el("h2", {}, [el("span", { class: "step" }, "3"), "Faithful Restoration — どこがどう補正されたか"]),
          field(
            "抽出ステータス(diag.extraction.status)",
            badge(
              block.diag.extraction.status,
              block.diag.extraction.status === "captured_matches_sourceFaithful" ? "ok" : "warn",
            ),
          ),
          field(
            "検出されたアーティファクト",
            artifacts.length
              ? el(
                  "table",
                  {},
                  [
                    el("tr", {}, [el("th", {}, "kind"), el("th", {}, "resolved"), el("th", {}, "note")]),
                    ...artifacts.map((a) =>
                      el("tr", {}, [el("td", {}, a.kind), el("td", {}, String(a.resolved)), el("td", {}, a.note)]),
                    ),
                  ],
                )
              : "(なし。抽出結果はそのままsourceFaithfulとして扱われた)",
          ),
          field(
            "復元方法",
            fr?.performed
              ? `${fr.method}(確信度: ${fr.confidence})`
              : "(復元は行われていない)",
          ),
        ]),
      );
      app.append(el("div", { class: "arrow" }, "↓"));

      // 4. sourceFaithful
      app.append(
        el("section", {}, [
          el("h2", {}, [el("span", { class: "step" }, "4"), "sourceFaithful — 教材上の忠実な表現(正本)"]),
          el("div", { class: "formula" }, block.sourceFaithful),
        ]),
      );
      app.append(el("div", { class: "arrow" }, "↓ [4] Source Segmentation"));

      // 5. Source Segmentation判定
      app.append(
        el("section", {}, [
          el("h2", {}, [el("span", { class: "step" }, "5"), "Source Segmentation判定 — なぜ確定Sourceになったか"]),
          field(
            "判定",
            badge(
              block.segmentationDecision.confirmed ? "確定Source" : "未確定(候補)",
              block.segmentationDecision.confirmed ? "ok" : "warn",
            ),
          ),
          field("適用ルール", block.segmentationDecision.rule),
          field("根拠", block.segmentationDecision.note),
        ]),
      );
      app.append(el("div", { class: "arrow" }, "↓"));

      // 6. 確定Source(まとめ)
      app.append(
        el("section", {}, [
          el("h2", {}, [el("span", { class: "step" }, "6"), "確定Source(ContentBlock) — 全体像"]),
          field("id", block.id),
          field("structureRef", block.structureRef),
          field("生データ(参考、折りたたみ)", (() => {
            const details = el("details", {}, []);
            details.append(el("summary", {}, "JSON全体を表示"));
            details.append(pre(JSON.stringify(block, null, 2)));
            return details;
          })()),
        ]),
      );

      app.append(el("div", { class: "arrow" }, "↓ M2: Derived Knowledge候補生成"));

      // 7. Derived Knowledge候補
      const dkc = data.derivedKnowledgeCandidate;
      if (!dkc) {
        app.append(
          el("section", {}, [
            el("h2", {}, [el("span", { class: "step" }, "7"), "Derived Knowledge候補"]),
            el("div", { class: "scope-out" }, "まだ生成されていません(M2未実行。node scripts/run-teigakuho-knowledge-candidate.mjs を実行してください)。"),
          ]),
        );
      } else {
        const k = dkc.knowledge;
        const rendered = renderTokens(k.content.structure);
        const roundTripOk = rendered === k.content.rawFormula;

        app.append(
          el("section", {}, [
            el("h2", {}, [el("span", { class: "step" }, "7"), "Derived Knowledge候補 — Sourceから何が生成されたか"]),

            field("reviewStatus(本体の外側で管理)", badge(STATUS_LABEL[dkc.reviewStatus], STATUS_KIND[dkc.reviewStatus])),

            field(
              "1. どのSourceから生成されたか(sourceRefs)",
              k.sourceRefs
                .map((r) => `${r.sourceBlockId}(role: ${r.role})`)
                .join(", "),
            ),

            field("2. knowledgeKind", k.knowledgeKind),

            field("3. rawFormula(sourceFaithfulと同一であることを確認)", [
              el("div", { class: "formula" }, k.content.rawFormula),
              el("div", { class: "field" }, [
                el("span", { class: "label" }, "sourceFaithful(6の再掲)との一致: "),
                badge(k.content.rawFormula === block.sourceFaithful ? "一致" : "不一致", k.content.rawFormula === block.sourceFaithful ? "ok" : "warn"),
              ]),
            ]),

            field("4. structureへの分解", [
              renderStructureTree(k.content.structure),
              el("div", { class: "field" }, [
                el("span", { class: "label" }, "往復整合性(tokensから復元した文字列とrawFormulaの一致、この場でブラウザが再計算): "),
                badge(roundTripOk ? "一致(OK)" : "不一致(要確認)", roundTripOk ? "ok" : "warn"),
              ]),
              (() => {
                const details = el("details", {}, []);
                details.append(el("summary", {}, "structure JSON全体を表示"));
                details.append(pre(JSON.stringify(k.content.structure, null, 2)));
                return details;
              })(),
            ]),

            field("5. 3軸状態", (() => {
              const details = el("details", { open: "" }, []);
              details.append(el("summary", {}, "contentConfidence / evidence / consolidation"));
              details.append(pre(JSON.stringify(
                {
                  contentConfidence: k.contentConfidence,
                  evidence: k.evidence,
                  consolidation: k.consolidation,
                  scopeNote: k.scopeNote,
                },
                null,
                2,
              )));
              return details;
            })()),

            field("6. reviewStatus(承認/修正/除外)", renderReviewPanel(dkc)),
          ]),
        );
      }

      app.append(el("div", { class: "arrow" }, "↓ M5: Exercise生成"));

      // 8. Exercise(閲覧のみ。問題を解くUIはM6で作る)
      const exercise = latestExercisesData?.exercises?.find(
        (ex) => ex.knowledgeRef.knowledgeId === (dkc?.knowledge?.id ?? null),
      );
      if (!dkc || dkc.reviewStatus !== "approved") {
        app.append(
          el("section", {}, [
            el("h2", {}, [el("span", { class: "step" }, "8"), "Exercise"]),
            el(
              "div",
              { class: "scope-out" },
              "承認済みKnowledgeが無いため、まだExerciseは生成されていません(M4で承認してください)。",
            ),
          ]),
        );
      } else if (!exercise) {
        app.append(
          el("section", {}, [
            el("h2", {}, [el("span", { class: "step" }, "8"), "Exercise"]),
            el(
              "div",
              { class: "scope-out" },
              "このKnowledgeに対応するExerciseはまだ生成されていません" +
                "(node scripts/run-teigakuho-exercise.mjs を実行してください)。",
            ),
          ]),
        );
      } else {
        app.append(
          el("section", {}, [
            el("h2", {}, [el("span", { class: "step" }, "8"), "Exercise — Knowledgeから何が生成されたか"]),

            field("Exercise ID", exercise.id),
            field(
              "元Knowledge ID(7のknowledge.idと一致することを確認)",
              badge(
                exercise.knowledgeRef.knowledgeId,
                exercise.knowledgeRef.knowledgeId === dkc.knowledge.id ? "ok" : "warn",
              ),
            ),
            field("問題形式(exerciseKind)", exercise.exerciseKind),
            field("instruction", [
              el("div", {}, exercise.prompt.instruction),
              el("div", { class: "field" }, [
                el("span", { class: "label" }, "instructionOrigin: "),
                badge(exercise.prompt.instructionOrigin, "warn"),
                " (教材由来のデータではないことを示す)",
              ]),
            ]),
            field(
              "出題時に提示されるチャンク / 正解順序(このUIでは正解の順序のまま表示。シャッフルはM6の責務)",
              el(
                "ol",
                {},
                exercise.answer.correctOrder.map((chunk) => el("li", {}, chunk)),
              ),
            ),
            field("判定規則(answer.grading.method)", exercise.answer.grading.method),
            field("解説として利用する情報(reveal)", (() => {
              const details = el("details", { open: "" }, []);
              details.append(el("summary", {}, "reveal.rawFormula / reveal.sourceRefs"));
              details.append(pre(JSON.stringify(exercise.reveal, null, 2)));
              return details;
            })()),
            field(
              "Knowledgeからどのように変換されたか",
              "content.structure.tokens(トップレベル5要素)の各要素をrenderTokens()でレンダリングし、" +
                "そのままanswer.correctOrderにした(順序は変更していない、シャッフルはM6が表示時に行う)。",
            ),
          ]),
        );
      }

      // 参考: 候補一覧・スコープ外検出
      app.append(
        el("section", {}, [
          el("h2", {}, "(参考) Source候補一覧レポート / このケースの対象外だった検出"),
          field(
            "Source候補一覧レポート",
            candidateReport.candidates.length
              ? JSON.stringify(candidateReport.candidates)
              : "候補0件(このケースはF3で即時確定したため候補化されていない)",
          ),
          field(
            "対象外だった検出(同じページ内の他の計算式)",
            outOfScopeDetections.length
              ? el(
                  "ul",
                  {},
                  outOfScopeDetections.map((d) =>
                    el("li", { class: "scope-out" }, `${d.precedingHeading ?? "(見出し不明)"} — ${d.reason}`),
                  ),
                )
              : "(なし)",
          ),
        ]),
      );
    }

    async function main() {
      try {
        const exercisesRes = await fetch("/api/exercises");
        latestExercisesData = exercisesRes.ok ? await exercisesRes.json() : null;

        const res = await fetch(`/api/case/${CASE_NAME}`);
        if (!res.ok) {
          throw new Error(`APIエラー: ${res.status}`);
        }
        const data = await res.json();
        render(data);
      } catch (err) {
        document.getElementById("error").textContent =
          `読み込みに失敗しました: ${err.message}\n` +
          `output/cases/${CASE_NAME}.json が存在するか、node scripts/run-teigakuho-case.mjs を` +
          `先に実行したか確認してください。`;
      }
    }

    main();
  </script>
</body>
</html>
